{% extends 'base.html' %}
{% block title %}新規登録{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">
          <i class="bi bi-wallet2 text-primary"></i> かけいぼ
        </h2>
        <h5 class="text-center text-muted mb-4">新規アカウント登録</h5>

        <form method="POST">
          <div class="mb-3">
            <label for="username" class="form-label">ユーザー名</label>
            <input type="text" class="form-control" id="username" name="username"
                   required autofocus>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">メールアドレス</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">パスワード</label>
            <input type="password" class="form-control" id="password" name="password"
                   required minlength="6">
          </div>
          <div class="mb-3">
            <label for="password2" class="form-label">パスワード（確認）</label>
            <input type="password" class="form-control" id="password2" name="password2"
                   required minlength="6">
          </div>
          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-person-plus"></i> 登録する
          </button>
        </form>

        <hr>
        <p class="text-center mb-0">
          すでにアカウントをお持ちの方は
          <a href="{{ url_for('auth.login') }}">ログイン</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
