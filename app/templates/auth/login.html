{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">
          <i class="bi bi-wallet2 text-primary"></i> かけいぼ
        </h2>
        <h5 class="text-center text-muted mb-4">ログイン</h5>

        <form method="POST">
          <div class="mb-3">
            <label for="username" class="form-label">ユーザー名</label>
            <input type="text" class="form-control" id="username" name="username"
                   required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">パスワード</label>
            <input type="password" class="form-control" id="password" name="password"
                   required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" name="remember">
            <label class="form-check-label" for="remember">ログイン状態を保持する</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> ログイン
          </button>
        </form>

        <hr>
        <p class="text-center mb-0">
          アカウントをお持ちでない方は
          <a href="{{ url_for('auth.register') }}">新規登録</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
